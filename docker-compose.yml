services:
  intranet:
    build: .
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
      DATA_FILE: /app/data/intranet.json
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-si-ware.com}
      GOOGLE_ADMIN_EMAILS: ${GOOGLE_ADMIN_EMAILS:-}
      SI_VOICE_API_URL: ${SI_VOICE_API_URL:-https://si-bot-dev.si-wareapps.com/api/agents/v1/chat/completions}
      SI_VOICE_API_TOKEN: ${SI_VOICE_API_TOKEN:-}
      SI_VOICE_MODEL: ${SI_VOICE_MODEL:-agent_p5r89lwIGSl7sYJRu80AH}
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: ${GOOGLE_SERVICE_ACCOUNT_KEY_FILE:-/run/secrets/google-workspace.json}
      GOOGLE_SYNC_SUBJECT: ${GOOGLE_SYNC_SUBJECT:-}
      GOOGLE_RECENTLY_JOINED_LOOKBACK_DAYS: ${GOOGLE_RECENTLY_JOINED_LOOKBACK_DAYS:-30}
      GOOGLE_HIRE_DATE_FIELD: ${GOOGLE_HIRE_DATE_FIELD:-}
      GOOGLE_DIVISION_FIELD: ${GOOGLE_DIVISION_FIELD:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME:-}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
