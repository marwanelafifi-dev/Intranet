<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 0; background: transparent; display: flex; justify-content: center; font-family: sans-serif; }
    #sibot-chat-container { width: 100%; max-width: 600px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 600px; background: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    #sibot-header { background: #0284c7; color: white; padding: 16px; font-weight: bold; font-size: 1.1em; }
    #sibot-messages { flex: 1; padding: 16px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; font-size: 0.95em; }
    .msg.user { background: #0284c7; color: white; align-self: flex-end; }
    .msg.bot { background: #e2e8f0; color: #1e293b; align-self: flex-start; }
    #sibot-footer { display: flex; border-top: 1px solid #e2e8f0; padding: 12px; background: white; }
    #sibot-input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.95em; }
    #sibot-send { background: #0284c7; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    #sibot-send:hover { background: #0369a1; }
  </style>
</head>
<body>

<div id="sibot-chat-container">
  <div id="sibot-header">Si-Ware Anonymous Feedback - Employee Voice</div>
  <div id="sibot-messages">
    <div class="msg bot">I am Si-Ware Anonymous Feedback Bot. Collects suggestions and complaints and rout them to management. Your identity will be hidden.</div>
	<div class="msg bot">Hello! How can I help you today?</div>
  </div>
  <div id="sibot-footer">
    <input type="text" id="sibot-input" placeholder="Type your message here..." autocomplete="off">
    <button id="sibot-send">Send</button>
  </div>
</div>

<script>
  const messagesContainer = document.getElementById('sibot-messages');
  const inputField = document.getElementById('sibot-input');
  const sendButton = document.getElementById('sibot-send');

  async function sendMessage() {
    const text = inputField.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    inputField.value = '';

    const loadingId = appendMessage('Thinking...', 'bot');

    try {
      const response = await fetch('https://si-bot-dev.si-wareapps.com/api/agents/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer sk-32e330153c02affee364ace2983bb670b62942a521fc73512de9ee4a99d76dc5'
        },
        body: JSON.stringify({
          model: "agent_p5r89lwIGSl7sYJRu80AH",
          messages: [{ role: "user", content: text }],
          stream: false
        })
      });

      const data = await response.json();
      const botReply = data.choices[0].message.content;
      document.getElementById(loadingId).innerText = botReply;
    } catch (error) {
      document.getElementById(loadingId).innerText = "Error: Could not reach the assistant.";
    }
  }

  function appendMessage(text, sender) {
    const msg = document.createElement('div');
    const id = 'msg-' + Math.random().toString(36).substr(2, 9);
    msg.id = id;
    msg.className = `msg ${sender}`;
    msg.innerText = text;

    messagesContainer.appendChild(msg);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return id;
  }

  sendButton.addEventListener('click', sendMessage);
  inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
